<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0f0f14"/>

  <!-- Caliper left jaw (outer) -->
  <rect x="16" y="28" width="10" height="72" rx="3" fill="#4A9EFF"/>
  <!-- Caliper right jaw (outer) -->
  <rect x="102" y="28" width="10" height="72" rx="3" fill="#4A9EFF"/>

  <!-- Top bar -->
  <rect x="16" y="28" width="96" height="10" rx="3" fill="#4A9EFF"/>

  <!-- Bottom bar (movable) -->
  <rect x="16" y="76" width="96" height="10" rx="3" fill="#4A9EFF" opacity="0.7"/>

  <!-- Measurement gap indicator -->
  <line x1="64" y1="38" x2="64" y2="76" stroke="#4A9EFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Center tick marks -->
  <rect x="58" y="36" width="12" height="2" rx="1" fill="white" opacity="0.6"/>
  <rect x="58" y="78" width="12" height="2" rx="1" fill="white" opacity="0.6"/>

  <!-- Depth rod -->
  <rect x="60" y="86" width="8" height="14" rx="2" fill="#4A9EFF" opacity="0.5"/>
</svg>
